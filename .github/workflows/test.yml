name: Test Suite & Lint

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  test:
    name: Lua Tests & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Lua & LuaJIT
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 luajit luarocks

      - name: Syntax Check All Lua Files
        run: |
          find . -name "*.lua" -exec luac -p {} +
          echo "All Lua files passed syntax validation."

      - name: Run Test Suite
        run: |
          luajit tools/spec_runner.lua